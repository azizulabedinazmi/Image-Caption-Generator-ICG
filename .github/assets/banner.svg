<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="photo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#fef3c7"/></linearGradient>
    <clipPath id="cap"><rect x="-4" y="-30" width="0" height="44"><animate attributeName="width" values="0;330;330;0" keyTimes="0;.55;.9;1" dur="5s" begin="-3s" repeatCount="indefinite"/></rect></clipPath>
    <style>.cur{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}</style>
  </defs>
  <rect width="1200" height="320" fill="#18181b"/>
  <g fill="#27272a"><circle cx="1150" cy="40" r="3"/><circle cx="1100" cy="290" r="3"/><circle cx="660" cy="30" r="3"/><circle cx="40" cy="290" r="3"/></g>
  <!-- polaroid -->
  <g transform="translate(760 22) rotate(-4)">
    <rect x="6" y="10" width="380" height="296" fill="#000" opacity=".4"/>
    <rect width="380" height="290" fill="#fafaf9"/>
    <g transform="translate(20 20)">
      <rect width="340" height="196" fill="url(#photo)"/>
      <circle cx="270" cy="48" r="22" fill="#fde047"/>
      <path d="M0 196V140l70-50 60 40 80-70 130 90v46z" fill="#4d7c0f"/>
      <path d="M150 196c10-30 30-40 50-40s30 20 40 40z" fill="#78350f"/>
      <rect x="40" y="30" width="110" height="140" fill="none" stroke="#f43f5e" stroke-width="3" stroke-dasharray="8 4"/>
      <text x="44" y="24" font-family="Consolas, Menlo, monospace" font-size="12" fill="#f43f5e">attention</text>
    </g>
    <g transform="translate(24 238)" font-family="'Segoe Print', 'Comic Sans MS', cursive" font-size="20" fill="#27272a">
      <text clip-path="url(#cap)">"a hill under a bright sun"</text>
    </g>
  </g>
  <text x="66" y="96" font-family="Consolas, Menlo, monospace" font-size="17" fill="#a1a1aa" letter-spacing="2">InceptionV3 ▸ Transformer encoder/decoder ▸ text</text>
  <text x="62" y="170" font-family="Georgia, 'Times New Roman', serif" font-size="64" fill="#fafafa">Image Caption</text>
  <text x="62" y="234" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-style="italic" fill="#f43f5e">Generator<tspan class="cur" fill="#fafafa">_</tspan></text>
  <text x="66" y="282" font-family="Consolas, Menlo, monospace" font-size="16" fill="#71717a">Streamlit · TensorFlow · ICG</text>
</svg>
